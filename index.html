<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera -->
    <header class="header">
        <h1>Mi Tienda Online</h1>
        <div class="update-tag">Catálogo Actualizado</div>
    </header>

    <!-- Caja de Tasa BCV -->
    <div style="max-width: 1100px; margin: 0 auto; padding: 0 15px;">
        <div class="tasa-box">
            Tasa BCV del día: <span id="tasa-dolar">Cargando...</span>
        </div>
    </div>

    <!-- Layout Principal -->
    <main class="main-layout" id="mainLayout">
        
        <!-- Centro: Buscador, Categorías y Productos -->
        <section class="content-center">
            <div class="controls-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar productos..." onkeyup="filterProducts()">
                </div>
                <div class="category-buttons">
                    <button class="btn-cat active" onclick="filterCategory('todos', event)">Todos</button>
                    <button class="btn-cat" onclick="filterCategory('viveres', event)">Víveres</button>
                    <button class="btn-cat" onclick="filterCategory('refrescos', event)">Refrescos</button>
                    <button class="btn-cat" onclick="filterCategory('helados', event)">Helados</button>
                    <button class="btn-cat" onclick="filterCategory('chucherias', event)">Chucherías</button>
                    <button class="btn-cat" onclick="filterCategory('limpieza', event)">Limpieza</button>
                    <button class="btn-cat" onclick="filterCategory('charcuteria', event)">Charcutería</button>
                </div>
            </div>

            <!-- Cuadrícula de productos inyectada por JS -->
            <div class="grid-container" id="productsGrid">
                <!-- Se llena dinámicamente -->
            </div>
        </section>

        <!-- Sidebar del Carrito (Escritorio) -->
        <aside class="cart-sidebar" id="cartSidebar" style="display: none;">
            <div class="cart-header">
                <h2>Carrito</h2>
                <span class="badge-count" id="carrito-contador-badge">0</span>
            </div>
            <div class="cart-items-container" id="lista-carrito">
                <!-- Items del carrito -->
            </div>
            <div class="cart-footer">
                <div class="cart-totals">
                    <div class="total-row">
                        <span>Total USD:</span>
                        <span class="highlight-price-usd">$<span id="carrito-total-usd">0.00</span></span>
                    </div>
                    <div class="total-row bs-row">
                        <span>Total Bs:</span>
                        <span class="highlight-price-bs">Bs. <span id="carrito-total-bs">0.00</span></span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar</button>
                    <button class="btn-whatsapp" onclick="enviarWhatsApp()">Pedir por WhatsApp</button>
                </div>
            </div>
        </aside>

    </main>

    <!-- Barra Inferior Flotante (Móvil) -->
    <nav class="mobile-bottom-nav">
        <a href="#" class="nav-item active" onclick="cerrarCarritoMovil(); return false;">
            <i class="fas fa-store"></i>
            <span>Tienda</span>
        </a>
        <a href="#" class="nav-item" onclick="abrirCarritoMovil(); return false;">
            <i class="fas fa-shopping-cart"></i>
            <span>Carrito</span>
            <span class="mobile-badge" id="mobile-badge" style="display: none;">0</span>
        </a>
    </nav>

    <!-- Modal del Carrito para Móviles -->
    <div id="mobileCartModal" class="mobile-cart-modal" style="display: none;">
        <div class="mobile-cart-header">
            <button class="btn-back" onclick="cerrarCarritoMovil()"><i class="fas fa-arrow-left"></i></button>
            <h2>Tu Carrito</h2>
        </div>
        <div id="mobileCartBodyContent" class="mobile-cart-body">
            <!-- Contenido dinámico para móvil -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Mi Tienda Online. Todos los derechos reservados.</p>
    </footer>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
