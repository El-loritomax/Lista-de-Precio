<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Precios e Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>PRECIOS ACTUALIZADOS</h1>
        <p class="update-tag">Última actualización: Hoy</p>
    </header>

    <div id="mainLayout" class="main-layout center-mode">

        <div class="content-center">
            <section class="controls-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar producto (ej: chocolate, galletas)..." onkeyup="filterProducts()">
                </div>
                
                <div class="category-buttons">
                    <button class="btn-cat active" onclick="filterCategory('todos')">Todos</button>
                    <button class="btn-cat" onclick="filterCategory('viveres')">Víveres</button>
                    <button class="btn-cat" onclick="filterCategory('charcuteria')">Charcutería</button>
                    <button class="btn-cat" onclick="filterCategory('verduras')">Verduras</button>
                    <button class="btn-cat" onclick="filterCategory('refrescos')">Refrescos</button>
                    <button class="btn-cat" onclick="filterCategory('chucherias')">Chucherías</button>
                    <button class="btn-cat" onclick="filterCategory('helados')">Helados</button>
                </div>
            </section>

            <main class="table-container">
                <table id="priceTable">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Presentación</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </main>

            <div class="tasa-box">
                Tasa del dólar oficial BCV: <span id="tasa-dolar">Cargando...</span>
            </div>
        </div>

        <aside id="cartSidebar" class="cart-sidebar" style="display: none;">
            <div class="cart-header">
                <h3>🛒 Tu Pedido</h3>
                <span id="carrito-contador-badge" class="badge-count">0</span>
            </div>
            
            <div id="lista-carrito" class="cart-items-container">
            </div>

            <div class="cart-footer">
                <div class="cart-totals">
                    <div class="total-row">
                        <span>Total USD:</span>
                        <span class="highlight-price-usd">$<span id="carrito-total-usd">0.00</span></span>
                    </div>
                    <div class="total-row bs-row">
                        <span>Total Bs:</span>
                        <span class="highlight-price-bs">Bs. <span id="carrito-total-bs">0.00</span></span>
                    </div>
                </div>

                <div class="cart-actions">
                    <button onclick="vaciarCarrito()" class="btn-vaciar">Vaciar</button>
                    <button onclick="enviarPedidoWhatsApp()" class="btn-whatsapp">Enviar Pedido 🚀</button>
                </div>
            </div>
        </aside>

    </div>

    <footer class="footer">
        <p>Los precios están sujetos a cambios sin previo aviso.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
