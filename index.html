<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Precios e Inventario</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos para la barra móvil -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <h1>PRECIOS ACTUALIZADOS</h1>
        <p class="update-tag">Última actualización: Hoy</p>
    </header>

    <div id="mainLayout" class="main-layout center-mode">

        <div class="content-center">
            <section class="controls-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." onkeyup="filterProducts()">
                </div>
                
                <div class="category-buttons">
                    <button class="btn-cat active" onclick="filterCategory('todos')">Todos</button>
                    <button class="btn-cat" onclick="filterCategory('viveres')">Víveres</button>
                    <button class="btn-cat" onclick="filterCategory('charcuteria')">Charcutería</button>
                    <button class="btn-cat" onclick="filterCategory('verduras')">Verduras</button>
                    <button class="btn-cat" onclick="filterCategory('refrescos')">Refrescos</button>
                    <button class="btn-cat" onclick="filterCategory('chucherias')">Chucherías</button>
                    <button class="btn-cat" onclick="filterCategory('helados')">Helados</button>
                </div>
            </section>

            <!-- Cuadrícula de Tarjetas -->
            <main class="grid-container" id="productsGrid">
                <!-- Se llena dinámicamente con JavaScript -->
            </main>

            <div class="tasa-box">
                Tasa del dólar oficial BCV: <span id="tasa-dolar">Cargando...</span>
            </div>
        </div>

        <!-- Carrito Lateral (PC) -->
        <aside id="cartSidebar" class="cart-sidebar" style="display: none;">
            <div class="cart-header">
                <h3>🛒 Tu Pedido</h3>
                <span id="carrito-contador-badge" class="badge-count">0</span>
            </div>
            
            <div id="lista-carrito" class="cart-items-container">
            </div>

            <div class="cart-footer">
                <div class="cart-totals">
                    <div class="total-row">
                        <span>Total USD:</span>
                        <span class="highlight-price-usd">$<span id="carrito-total-usd">0.00</span></span>
                    </div>
                    <div class="total-row bs-row">
                        <span>Total Bs:</span>
                        <span class="highlight-price-bs">Bs. <span id="carrito-total-bs">0.00</span></span>
                    </div>
                </div>

                <div class="cart-actions">
                    <button onclick="vaciarCarrito()" class="btn-vaciar">Vaciar</button>
                    <button onclick="enviarPedidoWhatsApp()" class="btn-whatsapp">Enviar Pedido 🚀</button>
                </div>
            </div>
        </aside>

    </div>

    <!-- Barra de navegación inferior móvil (Estilo App) -->
    <nav class="mobile-bottom-nav">
        <a href="#" class="nav-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <a href="#" class="nav-item" onclick="abrirCarritoMovil(); return false;">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Carrito</span>
            <span id="mobile-badge" class="mobile-badge" style="display: none;">0</span>
        </a>
    </nav>

    <footer class="footer">
        <p>Los precios están sujetos a cambios sin previo aviso.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
