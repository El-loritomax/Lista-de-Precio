<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Lista de Precios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 8px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #a71d2a;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sección de Login (Aparece si no has iniciado sesión) -->
        <div id="login-section">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="admin-email" placeholder="Tu correo">
            <input type="password" id="admin-password" placeholder="Tu contraseña">
            <button id="btn-login">Entrar</button>
        </div>

        <!-- Panel de Administración (Oculto hasta que inicias sesión) -->
        <div id="admin-panel" style="display: none;">
            <h2>Agregar Producto</h2>
            <input type="text" id="nombre-producto" placeholder="Nombre del producto">
            <input type="text" id="presentacion-producto" placeholder="Presentación (ej. 1 litro)">
            <input type="number" id="precio-producto" placeholder="Precio">
            <button id="btn-guardar">Guardar en Supabase</button>
            <button id="btn-logout" class="btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
